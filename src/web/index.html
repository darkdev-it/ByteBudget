<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteBudget - Personal Expense Tracker</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* Card Principale Animata */
        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        h2 {
            margin: 0 0 25px 0;
            color: #38bdf8;
            text-align: center;
            font-size: 1.8rem;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background: #0f172a;
            border: 1.5px solid #334155;
            color: #ffffff;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.25s ease;
        }

        input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #0f172a;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
        }

        .btn-secondary {
            width: 100%;
            background: transparent;
            color: #94a3b8;
            border: 1.5px solid #334155;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #f8fafc;
            border-color: #475569;
        }

        /* POP-UP / MODALE ANIMATO */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .success-icon {
            font-size: 48px;
            margin-bottom: 15px;
            display: inline-block;
            animation: popIn 0.5s ease 0.2s both;
        }

        .total-box {
            background: rgba(56, 189, 248, 0.1);
            border: 1px dashed #38bdf8;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
        }

        .total-box h3 {
            margin: 0;
            color: #94a3b8;
            font-size: 14px;
            text-transform: uppercase;
        }

        .total-amount {
            font-size: 28px;
            font-weight: 800;
            color: #38bdf8;
            margin-top: 5px;
        }

        .expense-list {
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            margin: 15px 0;
            padding-right: 5px;
        }

        .expense-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #334155;
            font-size: 14px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>ByteBudget</h2>
    <form id="expenseForm">
        <div class="form-group">
            <label for="descrizione">Descrizione</label>
            <input type="text" id="descrizione" name="descrizione" placeholder="es. Pranzo fuori" required>
        </div>
        <div class="form-group">
            <label for="importo">Importo (€)</label>
            <input type="number" step="0.01" id="importo" name="importo" placeholder="0.00" required>
        </div>
        <div class="form-group">
            <label for="categoria">Categoria</label>
            <input type="text" id="categoria" name="categoria" placeholder="es. cibo, svago" required>
        </div>
        <button type="submit" class="btn-primary">Registra Spesa</button>
    </form>
    <button id="btnLista" class="btn-secondary">Visualizza Lista Spese</button>
</div>

<!-- POP-UP CONFERMA INSERIMENTO -->
<div class="modal-overlay" id="modalConferma">
    <div class="modal-content">
        <div class="success-icon">⚡</div>
        <h3 style="margin:0; color:#fff;">Spesa Registrata!</h3>
        <p style="color:#94a3b8; font-size:14px; margin-top:8px;">La tua operazione è stata salvata correttamente nel database.</p>
        <button class="btn-primary" onclick="chiudiModale('modalConferma')">Continua</button>
    </div>
</div>

<!-- POP-UP LISTA E TOTALE -->
<div class="modal-overlay" id="modalLista">
    <div class="modal-content">
        <h3 style="margin:0; color:#fff;">Riepilogo Spese</h3>
        <div class="total-box">
            <h3>Totale Complessivo</h3>
            <div class="total-amount" id="txtTotale">0.00 €</div>
        </div>
        <div class="expense-list" id="listaSpeseContainer">
            <!-- Verrà popolato dinamicamente -->
        </div>
        <button class="btn-secondary" onclick="chiudiModale('modalLista')">Chiudi</button>
    </div>
</div>

<script>
    // Invio form asincrono per mostrare il pop-up senza ricaricare la pagina
    document.getElementById('expenseForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new URLSearchParams(new FormData(this));

        fetch('/aggiungi', {
            method: 'POST',
            body: formData
        }).then(res => {
            if(res.ok) {
                apriModale('modalConferma');
                document.getElementById('expenseForm').reset();
            }
        });
    });

    // Tasto visualizza lista
    // Tasto visualizza lista corretto con gestione degli errori
    document.getElementById('btnLista').addEventListener('click', function() {
        fetch('/lista-dati')
            .then(res => {
                if (!res.ok) {
                    throw new Error("Errore di connessione al server o rotta non trovata!");
                }
                return res.json();
            })
            .then(data => {
                let container = document.getElementById('listaSpeseContainer');
                container.innerHTML = '';

                if (data.spese.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#94a3b8;">Nessuna spesa registrata.</p>';
                } else {
                    data.spese.forEach(item => {
                        container.innerHTML += `
                        <div class="expense-item">
                            <span><strong>${item.desc}</strong> (${item.cat})</span>
                            <span style="color:#38bdf8;">${item.imp.toFixed(2)} €</span>
                        </div>
                    `;
                    });
                }

                document.getElementById('txtTotale').innerText = `${data.totale.toFixed(2)} €`;
                apriModale('modalLista');
            })
            .catch(err => {
                console.error(err);
                alert("Impossibile caricare la lista. Assicurati che il server Java sia acceso e riavviato!");
            });
    });

    function apriModale(id) {
        document.getElementById(id).classList.add('active');
    }

    function chiudiModale(id) {
        document.getElementById(id).classList.remove('active');
    }
</script>
</body>
</html>
